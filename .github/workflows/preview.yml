name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🏗️ Build
        run: bun run build

      - name: 🗄️ Create D1 Database
        id: create-db
        run: bun run .github/scripts/preview/create-d1-db.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔍 Get D1 Database ID
        id: get-db
        run: bun run .github/scripts/preview/get-d1-db-id.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔄 Prepare wrangler config for preview
        id: prepare-config
        run: bun run .github/scripts/preview/prepare-wrangler-config.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DB_ID: ${{ steps.get-db.outputs.database_id }}
          DB_NAME: ${{ steps.get-db.outputs.database_name }}

      - name: 🔄 Run Database Migrations
        run: |
          bun wrangler d1 migrations apply DB --remote --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🔐 Set BETTER_AUTH_SECRET
        run: bun run .github/scripts/preview/set-better-auth-secret.ts
        env:
          WORKER_NAME: ${{ steps.prepare-config.outputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc

      - name: 📋 Get preview URL
        id: get-url
        run: |
          PREVIEW_URL="https://${{ steps.prepare-config.outputs.worker_name }}.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev"
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = '${{ steps.get-url.outputs.preview_url }}';
            const dbName = '${{ steps.get-db.outputs.database_name }}';

            const comment = `## 🚀 Preview Environment Deployed

            **Preview URL:** <a href="${previewUrl}" target="_blank">${previewUrl}</a>
            **Database:** \`${dbName}\`

            This preview environment will be automatically cleaned up when the PR is closed.`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Environment Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🗑️ Delete Worker
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name "cloudflare-worker-app-pr-${{ github.event.pull_request.number }}" --force

      - name: 🗑️ Delete D1 Database
        continue-on-error: true
        run: bun run .github/scripts/preview/delete-d1-db.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;

            const comment = `## 🧹 Preview Environment Cleaned Up

            The preview environment and database have been deleted.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
